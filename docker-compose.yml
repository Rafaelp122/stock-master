services:
  # --- BACKEND: API Django REST Framework ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # O comando roda o servidor de dev do Django acessível externamente (0.0.0.0)
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      # Sincroniza o código da sua máquina com o container (Live Reload)
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-troque-isso-na-producao
      - ALLOWED_HOSTS=*
      # Variáveis que o Django usa para se conectar ao serviço 'db' abaixo
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=stock_db
      - DB_USER=stock_user
      - DB_PASSWORD=stock_pass
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        # IMPORTANTE: Não apenas inicia o 'db', mas espera ele estar "Saudável" (Healthy)
        # Isso evita que o Django tente conectar enquanto o Postgres ainda está ligando.
        condition: service_healthy 
  
  # --- FRONTEND: React + Vite ---
  frontend:
    build: ./frontend
    volumes:
      # Espelha seu código React para o container
      - ./frontend:/app
      # SHADOWING: Cria um volume isolado para as bibliotecas do container.
      # Isso impede que o 'node_modules' da sua máquina física sobrescreva o do container.
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      # Força o Vite a observar mudanças de arquivos
      # via 'polling' (necessário em alguns sistemas de arquivos/Docker no Linux).
      - CHOKIDAR_USEPOLLING=true

  # --- DATABASE: PostgreSQL ---
  db:
    image: postgres:15-alpine
    volumes:
      # Volume nomeado: Se você apagar o container, seus produtos e vendas continuam salvos aqui.
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=stock_db
      - POSTGRES_USER=stock_user
      - POSTGRES_PASSWORD=stock_pass
    ports:
      - "5432:5432"
    # MECANISMO DE SEGURANÇA (Healthcheck):
    # Garante que o serviço só seja considerado "OK" quando o banco aceitar conexões reais.
    healthcheck:
      # Tenta rodar o comando 'pg_isready' dentro do banco de 3 em 3 segundos.
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_db"]
      interval: 3s
      timeout: 5s
      retries: 10
      # Dá 15 segundos de folga para o banco carregar e criar o DB na primeira inicialização.
      start_period: 15s

# Definição dos volumes permanentes (não somem ao desligar o Docker)
volumes:
  # Onde o banco de dados mora
  postgres_data:
  # Onde as bibliotecas do React moram (melhora a performance e isolamento)
  frontend_node_modules: